<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semin Jin</title>
<meta name="description" content="Semin Jin — Post-doctoral researcher in Interior Architecture Design at Hanyang University. Human-AI Collaboration in Design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════
     HERO — Anthropometric Scene Generator
     ══════════════════════════════════════════════════ -->
<header class="hero">
  <div class="hero-text">
    <p class="hero-eyebrow">Designer &times; Researcher</p>
    <h1 class="hero-name">Semin<br><em>Jin</em></h1>
    <p class="hero-lede">I design how people and machines shape space together.</p>
    <p class="hero-sub">
      Post-doctoral researcher in <b>Interior Architecture Design</b> at Hanyang University,
      working on <b>Human&ndash;AI Collaboration in Design</b> &mdash; spatial, perceptual, and experiential.
    </p>
    <nav class="lens" role="tablist" aria-label="research lens">
      <button class="lens-btn" role="tab" data-mode="spatial"      aria-selected="true">Spatial</button>
      <button class="lens-btn" role="tab" data-mode="perceptual"   aria-selected="false">Perceptual</button>
      <button class="lens-btn" role="tab" data-mode="experiential" aria-selected="false">Experiential</button>
    </nav>
    <p class="lens-desc" id="lens-desc"></p>

    <div class="hero-actions">
      <div data-ctl="spatial">
        <button class="regen" id="regen" type="button">&#8635; Regenerate layout</button>
      </div>
      <div data-ctl="perceptual" class="cml" hidden>
        <button class="cml-btn" id="btn-c" type="button"><b>C</b> <span id="chip-c"></span></button>
        <button class="cml-btn" id="btn-m" type="button"><b>M</b> <span id="chip-m"></span></button>
        <button class="cml-btn" id="btn-l" type="button"><b>L</b> <span id="chip-l"></span></button>
      </div>
      <div data-ctl="experiential" hidden>
        <span class="ctl-hint">&#8599; Pick a node in the graph</span>
      </div>
      <a class="hero-scroll" href="#publication">Research <span>&darr;</span></a>
    </div>
  </div>
  <div class="hero-scene">
    <svg id="scene" role="img" aria-label="Isometric room layout generated with anthropometric clearance zones"></svg>
  </div>
</header>

<!-- ══════════════════════════════════════════════════
     탭 — 기존 사이트 내용
     ══════════════════════════════════════════════════ -->
<nav class="tabs">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-panel="publication" aria-selected="true">Publication</button>
    <button class="tab" role="tab" data-panel="patent"      aria-selected="false">Patent</button>
    <button class="tab" role="tab" data-panel="design"      aria-selected="false">Design Work</button>
    <button class="tab" role="tab" data-panel="teaching"    aria-selected="false">Teaching &amp; Academic Service</button>
    <button class="tab" role="tab" data-panel="cv"          aria-selected="false">CV</button>
  </div>
</nav>

<div class="wrap">
  <div class="layout">
    <main id="panel" class="panel is-active"></main>
    <aside id="side" class="side"></aside>
  </div>
</div>

<script src="assets/js/scene.js"></script>
<script src="data/site.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
